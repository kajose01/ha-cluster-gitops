apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels: { app: webapp, env: dev }
spec:
  replicas: 1
  selector:
    matchLabels: { app: webapp }
  template:
    metadata:
      labels: { app: webapp, env: dev }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [ { containerPort: 80 } ]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  labels: { app: webapp }
spec:
  selector: { app: webapp }
  ports: [ { port: 80, targetPort: 80 } ]
