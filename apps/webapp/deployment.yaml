apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels: { app: webapp, env: staging }
spec:
  replicas: 2
  selector:
    matchLabels: { app: webapp }
  template:
    metadata:
      labels: { app: webapp, env: staging }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [ { containerPort: 80 } ]
          # sized conservatively for a static nginx page; not load-tested
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          # startup probe gives the container up to 60 s to come up; then readiness gates traffic and liveness restarts a hung container
          startupProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  labels: { app: webapp }
spec:
  selector: { app: webapp }
  ports: [ { port: 80, targetPort: 80 } ]
