apiVersion: v1
kind: Namespace
metadata: { name: dev }
---
apiVersion: v1
kind: Namespace
metadata: { name: staging }
---
apiVersion: v1
kind: Namespace
metadata: { name: production }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: developer, namespace: dev }
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "pods/log", "services", "configmaps", "deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: alice-developer, namespace: dev }
subjects: [ { kind: User, name: alice, apiGroup: rbac.authorization.k8s.io } ]
roleRef: { kind: Role, name: developer, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: read-only }
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "configmaps", "deployments", "replicasets", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: bob-read-only }
subjects: [ { kind: User, name: bob, apiGroup: rbac.authorization.k8s.io } ]
roleRef: { kind: ClusterRole, name: read-only, apiGroup: rbac.authorization.k8s.io }
